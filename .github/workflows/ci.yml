name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      # Sin fail-fast: un fallo en un sistema no cancela los demás. En el run
      # 34767866217 cayó windows-latest y GitHub canceló macos-latest, y se perdió
      # justo la señal que decía si el fallo era de Windows o de todos.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # setup-go v7 (runtime node24). Estuvo en v5 porque v6 cambió la selección
      # de toolchain, que interactúa con el `go 1.27.1` de go.mod, y eso solo se
      # comprueba ejecutando el CI: se subió junto con fail-fast: false, y el run
      # de ese push es la comprobación.
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - name: Format
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race
      # Los tests de la CLI comparan salidas byte a byte y necesitan reloj y
      # semilla fijos, así que se compilan con el tag `testhooks`. El binario
      # que se publica NO lleva ese tag: ver .goreleaser.yaml y hooks_off.go.
      - name: Test (con ganchos de prueba)
        run: go test -tags testhooks ./... -race

  # El verificador de TypeScript corre contra los MISMOS ficheros de
  # testdata/vectors/ que la suite de Go. Es lo que impide que las dos
  # implementaciones diverjan sin que nadie se entere.
  sdk-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # La versión la fija sdk/ts/.nvmrc, para que CI y la máquina de quien
          # desarrolla usen exactamente la misma. Es 22 porque en 18 el Ed25519
          # de WebCrypto es experimental y emite un warning en cada ejecución.
          node-version-file: sdk/ts/.nvmrc
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # El bundle que sirve web/verify/ se regenera y se prueba en el mismo
      # job: si se quedara viejo, la página enseñaría veredictos producidos por
      # código que ninguna suite mira.
      - name: Bundle
        run: npm run bundle
      - name: Test
        run: npm test
      - name: El bundle publicado está al día
        run: git diff --exit-code ../../web/verify/nucleo-verify.js

  # Fuzz corto de los formatos de cable.
  #
  # Dos cosas distintas protegen aquí, y conviene no confundirlas:
  #
  #  1. El CORPUS de regresión ya corre en cada job de test, gratis: los ficheros
  #     de internal/*/testdata/fuzz son casos normales para `go test`. Una entrada
  #     que rompió algo una vez no vuelve a pasar desapercibida sin que este job
  #     exista. Eso es lo que de verdad impide retrocesos.
  #  2. Este job EXPLORA caminos nuevos en el código que acaba de cambiar, que es
  #     lo único que el corpus no puede hacer.
  #
  # 15 segundos por fuzzer y no 30: ocho fuzzers × 15 s más el arranque dan unos
  # 2m30s, que es justo lo que ya tarda el job más lento (test en macOS). Así el
  # tiempo total de CI no sube, porque este job no pasa a ser el camino crítico.
  # Con 30 s sí lo sería, y el precio —cuatro minutos de espera en cada push— no
  # lo compensa un fuzzing que de todas formas es demasiado corto para encontrar
  # nada profundo. Lo profundo se busca a mano, en tandas de minutos, y el
  # hallazgo se deja en el corpus.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - name: Fuzz de los formatos de cable
        run: |
          set -e
          while read -r pkg fn; do
            [ -z "$pkg" ] && continue
            echo "── $pkg $fn"
            go test "./$pkg" -run='^$' -fuzz="^${fn}\$" -fuzztime=15s
          done <<'LIST'
          internal/checkpoint FuzzParseBody
          internal/checkpoint FuzzParseNote
          internal/checkpoint FuzzVerifyNote
          internal/witness FuzzUnmarshalAddCheckpoint
          internal/witness FuzzCosignature
          internal/proof FuzzParseProof
          internal/receipt FuzzParseReceipt
          internal/receipt FuzzTextoLegible
          LIST
      # Un hallazgo del fuzzer deja un fichero nuevo en testdata/fuzz. En CI eso
      # se perdería al terminar el job, así que se sube como artefacto: sin él,
      # el log diría que algo falló y nadie podría reproducirlo.
      - name: Guardar el caso que falló, si lo hay
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-del-fallo
          path: internal/**/testdata/fuzz/**
          if-no-files-found: ignore

  # Diferencial Go ↔ TypeScript (C.4 del Sprint 7c).
  #
  # Los vectores compartidos solo prueban que los dos verificadores coinciden en
  # ACEPTAR. La auditoría adversarial encontró cuatro entradas en las que Go
  # aceptaba y TypeScript rechazaba, y ninguna suite las miraba. Este job genera
  # un catálogo de mutaciones del recibo golden con el veredicto de Go
  # (internal/receipt/diferencial_test.go) y lo pasa por el bundle que sirve la
  # página (sdk/ts/scripts/diferencial.mjs). Cualquier divergencia de veredicto
  # falla el job — aunque los dos rechacen, si rechazan por motivos distintos no
  # es divergencia; si uno acepta y otro no, sí. Para añadir mutaciones, ver el
  # test de Go.
  diferencial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v7
        with:
          node-version-file: sdk/ts/.nvmrc
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      # Los recibos golden salen de un oráculo Python INDEPENDIENTE (Sprint 7f). Si
      # el repositorio y el oráculo dejan de coincidir, alguien editó un vector a mano
      # o cambió el formato sin regenerarlos: en los dos casos el vector ha dejado de
      # ser una vara externa y hay que enterarse aquí.
      - name: Los vectores golden coinciden con el oráculo
        run: python3 testdata/vectors/receipt/generar.py --check
      - name: Catálogo con los veredictos de Go
        run: NUCLEO_DIFERENCIAL_OUT="$RUNNER_TEMP/catalogo.json" go test ./internal/receipt -run '^TestDiferencialGeneraCatalogo$'
      # PHP es el TERCER verificador desde el Sprint 8 (ADR-021 §F), escrito desde
      # PROTOCOL.md y no portado: dos implementaciones con el mismo linaje comparten
      # errores. La imagen del runner trae php-cli; sodium hace falta para Ed25519.
      - name: PHP con sodium
        run: |
          php -v
          php -r 'exit(extension_loaded("sodium") ? 0 : 1)' || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends php-sodium
          }
          php -r 'if (!extension_loaded("sodium")) { fwrite(STDERR, "PHP sin sodium: el diferencial no podria usarlo"); exit(1); }'
      # Con NUCLEO_BIN, la suite de PHP incluye el sellado de punta a punta: PHP
      # ejecutando el binario de verdad, con clave de idempotencia (ADR-020 §D). Sin la
      # variable, la suite AVISA de que esa parte no se comprobó.
      - name: La suite del SDK de PHP contra los vectores compartidos
        run: |
          go build -o "$RUNNER_TEMP/nucleo" ./cmd/nucleo
          NUCLEO_BIN="$RUNNER_TEMP/nucleo" php sdk/php/test/run.php
      - name: Los mismos recibos por el bundle de TypeScript
        working-directory: sdk/ts
        run: |
          npm ci
          npm run bundle
          node scripts/diferencial.mjs "$RUNNER_TEMP/catalogo.json"
        # El script busca `php` en el PATH y falla si lo encuentra y no funciona; si no
        # hubiera PHP lo diría en voz alta en vez de callarse.

  # Lint: solo linters que señalan problemas reales, nunca reglas de estilo.
  # La configuración y el porqué de cada exclusión están en .golangci.yml.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      # Segunda pasada con el tag, para que el código de los ganchos de prueba
      # también se analice. Sin esto, hooks_on.go no lo vería nadie.
      - name: Lint (con ganchos de prueba)
        run: golangci-lint run --build-tags testhooks ./...

