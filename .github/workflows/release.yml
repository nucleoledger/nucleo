name: release

# Solo un tag publica. Un push a main no dispara nada de esto.
#
# Y solo un tag DEL CORE: `v` seguida de un dígito (v0.2.0-alpha, v1.0.0). El filtro
# era `v*`, que también captura los tags del SDK de TypeScript (`vsdk-*`, que publica
# publish-npm.yml con su propio ritmo). Pasó de verdad: el tag vsdk-0.2.0-alpha.0 lanzó
# este workflow (run 36098169879), corrió los tests y la demo, y lo único que impidió un
# release del binario con el número del SDK fue que goreleaser no supo leer
# "vsdk-0.2.0-alpha.0" como versión semántica. Que un parser rechace un tag no es un
# control: es suerte. Este filtro sí lo es.
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  release:
    # Imagen FIJADA. Es el job donde más importa: de aquí salen los binarios que se
    # publican y se firman, y una migración silenciosa del runner cambiaría el entorno de
    # compilación sin que nadie lo pidiera. Hoy `ubuntu-latest` ya resuelve a esta misma
    # imagen, así que fijarla no cambia nada más que quién decide cuándo se mueve.
    runs-on: ubuntu-24.04
    permissions:
      # Para crear el release y subir los artefactos.
      contents: write
      # El token OIDC es lo que hace posible la firma keyless: acredita ante
      # Sigstore QUÉ workflow, de QUÉ repositorio y sobre QUÉ tag está firmando.
      # Sin él habría que guardar una clave privada en un secreto, que es
      # justamente lo que se quiere evitar.
      id-token: write
      # Para la attestation de procedencia nativa de Actions.
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser necesita el historial completo y los tags para calcular
          # la versión y el commit.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - uses: sigstore/cosign-installer@v3

      - name: Comprobaciones antes de publicar
        # El release corre los tests por su cuenta (hook `before` de
        # goreleaser), pero el criterio de éxito del proyecto se comprueba aquí
        # explícitamente: si esa demo no pasa, no hay versión que publicar.
        run: |
          go test ./... -race
          ./scripts/demo-criterio-exito.sh

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # cosign no debe preguntar nada: no hay un humano delante.
          COSIGN_YES: "true"
          # La versión es el tag que disparó el workflow, dicho explícitamente. Sin
          # esto goreleaser la deduce de los tags del commit, y si un commit lleva a la
          # vez un tag del core y uno del SDK puede quedarse con el que no es: en el
          # run 36098169879 eligió `current=vsdk-0.2.0-alpha.0` por su cuenta.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # Attestation de procedencia nativa de GitHub, además de la firma de
      # cosign. Son dos cosas distintas y ninguna sustituye a la otra: la firma
      # dice "estos bytes se firmaron desde este workflow"; la attestation
      # describe CÓMO se construyeron, en el formato SLSA que otras herramientas
      # ya saben leer.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.tar.gz,dist/*.zip,dist/checksums.txt'
