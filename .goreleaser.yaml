# Configuración de release de Núcleo.
#
# Un producto de integridad no distribuye binarios sin firmar. Todo lo de aquí
# apunta a que quien descargue el binario pueda comprobar, sin confiar en
# nosotros ni en GitHub, que es el que se compiló desde este código.
version: 2

project_name: nucleo

before:
  hooks:
    - go mod download
    - go test ./... -race
    - go test -tags testhooks ./... -race

builds:
  - id: nucleo
    main: ./cmd/nucleo
    binary: nucleo
    env:
      # Sin cgo: es lo que permite un binario estático para cada plataforma sin
      # arrastrar una toolchain de C, y es la razón por la que el SQLite de este
      # proyecto es el driver de Go puro.
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
      # Sin -tags: los ganchos de prueba (NUCLEO_TEST_SEED y compañía) viven
      # tras el tag `testhooks` y NO se compilan aquí. Un binario publicado que
      # los honrara permitiría fijar el material "aleatorio" de las claves desde
      # el entorno del proceso.
    ldflags:
      # -s -w quitan la tabla de símbolos y la información de depuración: el
      # binario pesa menos y, sobre todo, dos compilaciones del mismo commit
      # producen los mismos bytes.
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.FullCommit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: nucleo
    ids: [nucleo]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - src: docs/TUTORIAL-es.md
        dst: docs/TUTORIAL-es.md
      - src: docs/PROTOCOL.md
        dst: docs/PROTOCOL.md
      - src: docs/RELEASING.md
        dst: docs/RELEASING.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# La firma es keyless: cosign obtiene un certificado efímero del OIDC de las
# Actions de GitHub, firma, y publica la entrada en el log de transparencia
# público de Sigstore (Rekor). No hay ninguna clave privada que guardar ni que
# perder, y la identidad que firmó queda registrada en un log que ni nosotros
# podemos reescribir. Es la misma idea que este proyecto vende, aplicada a sí
# mismo.
#
# Dos firmas del mismo checksums.txt, y las dos keyless:
#
#   · `checksums`: .sig + .pem, el formato con el que se publicaron v0.1.0-alpha y
#     v0.2.0-alpha. Se mantiene porque hay recetas de verificación en uso que lo
#     esperan, y cosign lo sigue aceptando —con un aviso de obsolescencia—.
#   · `bundle`: checksums.txt.sigstore.json, un bundle de Sigstore (formato v0.3)
#     con la firma, el certificado y la prueba de Rekor en un solo fichero. Es lo
#     que cosign 3 pide verificar con --bundle, y lo que durará cuando quite
#     --signature y --certificate. El nombre sigue la convención de sigstore y de
#     goreleaser para sus propios releases.
#
# `--new-bundle-format` hace falta porque el cosign de CI es 2.5.2 (ver release.yml):
# sin él, cosign 2 escribe el bundle ANTIGUO, que no es el que cosign 3 verifica. Se
# comprobó el 2026-09-26 que un bundle escrito así por 2.5.2 lo verifica cosign 3.1.3.
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
  - id: bundle
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--new-bundle-format"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  # El CHANGELOG lo escribe una persona: agrupar mensajes de commit por prefijo
  # produce una lista de cambios que solo entiende quien ya sabe lo que pasó.
  disable: true

release:
  draft: true
  prerelease: auto
  header: |
    ## Núcleo {{ .Tag }}

    Verifica lo que descargas antes de usarlo. El procedimiento está en
    [docs/RELEASING.md](https://github.com/nucleoledger/nucleo/blob/{{ .Tag }}/docs/RELEASING.md#verificar-una-descarga)
    y no lleva más de un minuto.
  footer: |
    ---
    Los binarios no llevan clave privada detrás: la firma es keyless de Sigstore,
    hecha por el workflow de Actions de este repositorio, y la identidad que
    firmó consta en el log público de transparencia de Rekor.
